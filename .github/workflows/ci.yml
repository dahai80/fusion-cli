name: CI

on:
  push:
    branches: [main, port-standardization]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # #53 依赖锁固化: 提交 Cargo.lock + cargo-deny 守护 (许可证/漏洞/重复/禁包)。
  deny:
    name: Cargo Deny (licenses/advisories/bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # 直接 cargo install cargo-deny, 不用 EmbarkStudios/cargo-deny-action@v2:
      # 该 action v2 把 arguments 拼到 command 之前, 导致 `cargo-deny advisories ... check`
      # 被解析为未知子命令 (2026-09-01 上游回归)。直接调用 cargo deny 顺序确定。
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --quiet
      # 校验全部维度: 许可证白名单 + RustSec 漏洞公告 + 重复依赖 + 禁包 + 源白名单。
      # deny.toml 在仓库根自动发现; all-features 在 [graph] 段配置, 无需 CLI 传参。
      - run: cargo deny check advisories bans licenses sources

  check:
    name: Check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  test:
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  fmt:
    name: Rustfmt
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  build:
    name: Build Release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: fusion-darwin-arm64
          - os: ubuntu-latest
            artifact: fusion-linux-x86_64
    runs-on: ${{ matrix.os }}
    needs: [check, test, fmt, clippy, deny]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Linux: 本 CLI 依赖 macOS 原生 (fusion-mlx/Apple Silicon 生态), 但 CLI 自身
      # 纯 Rust, Linux 可编译分发 (远程节点/CI 旁路用)。apt 装 build 必要系统库。
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release/fusion
