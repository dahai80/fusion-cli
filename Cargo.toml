[package]
name = "fusion-cli"
version = "0.4.3-beta.1"
description = "Fusion-CLI — One CLI, Control All Fusion-MLX Local AI Ecosystem."
edition = "2024"
authors = ["Fusion-MLX Team"]
license = "Apache-2.0"

[features]
default = ["native"]

# Native: macOS Apple Silicon with full Metal/MLX support
native = []

[dependencies]
# CLI framework
clap = { version = "4", features = ["derive", "env"] }

# HTTP client for fusion-mlx API
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
eventsource-stream = "0.2"
async-trait = "0.1"
once_cell = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Terminal UI
dialoguer = "0.11"
indicatif = "0.17"
tabled = "0.18"
ratatui = "0.29"
crossterm = "0.28"
clap_complete = "4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# System info
sysinfo = { version = "0.33", features = ["apple-app-store", "disk", "network", "component"] }

# Cron scheduling
cron = "0.15"

# Error handling
anyhow = "1"
thiserror = "2"

# Path handling
dirs = "6"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Colored output
colored = "3"

# At-rest config encryption (#50): AES-256-GCM + OS-entropy nonce。
# master.key 本地封套 (类 age/credential-helper), 内存明文 / 落盘密文。
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"

# #51 审计 hash chain 防篡改: SHA-256 链式哈希, fusion audit verify 校验完整性。
sha2 = "0.10"
# #51 跨进程互斥: 并发 fusion run 写审计需 flock(LOCK_EX) 串行化, 防 last_hash 竞态分叉链。
# libc 已是传递依赖 (reqwest/tokio/sysinfo), 直接声明不引入新版本。
libc = "0.2"

[[bin]]
name = "fusion"
path = "src/main.rs"