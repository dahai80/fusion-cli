[package]
name = "fusion-cli"
version = "0.2.7"
description = "Fusion-CLI — One CLI, Control All Fusion-MLX Local AI Ecosystem."
edition = "2024"
authors = ["Fusion-MLX Team"]
license = "Apache-2.0"

[features]
default = ["native"]

# Native: macOS Apple Silicon with full Metal/MLX support
native = []

[dependencies]
# CLI framework
clap = { version = "4", features = ["derive", "env"] }

# HTTP client for fusion-mlx API
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
eventsource-stream = "0.2"
async-trait = "0.1"
once_cell = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Terminal UI
dialoguer = "0.11"
indicatif = "0.17"
tabled = "0.18"
ratatui = "0.29"
crossterm = "0.28"
clap_complete = "4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# System info
sysinfo = { version = "0.33", features = ["apple-app-store", "disk", "network", "component"] }

# Cron scheduling
cron = "0.15"

# Error handling
anyhow = "1"
thiserror = "2"

# Path handling
dirs = "6"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Colored output
colored = "3"

[[bin]]
name = "fusion"
path = "src/main.rs"